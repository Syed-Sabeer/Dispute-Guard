query ChargeGuardOrder($id: ID!) {
  order(id: $id) {
    id name email createdAt displayFulfillmentStatus customer { firstName }
    totalPriceSet { shopMoney { amount currencyCode } }
    fulfillments(first: 250) {
      id status displayStatus trackingInfo { company number url }
      events(first: 100) { nodes { status happenedAt } pageInfo { hasNextPage } }
    }
    refunds {
      id createdAt totalRefundedSet { shopMoney { amount currencyCode } }
      transactions(first: 100) { nodes { kind status processedAt amountSet { shopMoney { amount currencyCode } } } pageInfo { hasNextPage } }
    }
  }
}
